<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#294b39" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Cattle Records" />
  <title>Cattle Records</title>
  <!-- Cattle Records build v55 blank ineligible cells -->
  <link rel="manifest" href="manifest.webmanifest?v=54" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=48" />
  <link rel="stylesheet" href="styles.css?v=55" />
</head>
<body>
  <div id="app"><main class="screen"><p class="muted">Loading cattle records…</p></main></div>
  <div id="modalRoot"></div>
  <script type="module">
    import("./app.js?v=55").catch(error=>{
      console.error("Cattle Records startup failed",error);
      const root=document.getElementById("app");
      if(root)root.innerHTML=`<main class="screen"><section class="auth-card"><p class="eyebrow">Cattle Records</p><h2>App could not start</h2><p class="muted">The app files did not load correctly. Make sure you are online, then close and reopen the app.</p><p class="muted" style="font-size:.8rem;word-break:break-word">${String(error?.message||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}</p></section></main>`;
    });
  </script>
</body>
</html>
